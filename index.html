/* Clippy 2.0 */
#pz #pzc{filter:drop-shadow(0 3px 3px rgba(0,0,0,.25));width:64px;height:115px;animation:none;transform-origin:50% 100%}
#pzc svg{overflow:visible;display:block;animation:pzb 4s ease-in-out infinite}
@keyframes pzb{50%{transform:scale(1.015,.985)}}
#pzc .pze,#pzc .pzbr,#pzd,#pzz{transform-box:fill-box;transform-origin:center}
.pze{animation:pzbl 5.5s infinite}
@keyframes pzbl{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.07)}}
.pzbr{transition:transform .2s}
#pzd,#pzz{opacity:0}
.a-hop{animation:pzhop .7s}
@keyframes pzhop{0%,100%{transform:none}20%{transform:scale(1.08,.88)}45%{transform:translateY(-18px) scale(.94,1.08) rotate(-6deg)}75%{transform:scale(1.06,.92) rotate(4deg)}}
.a-wiggle{animation:pzwg .7s}
@keyframes pzwg{0%,100%{transform:none}20%{transform:rotate(-9deg)}40%{transform:rotate(8deg)}60%{transform:rotate(-6deg)}80%{transform:rotate(4deg)}}
.a-wave{animation:pzwv 1.2s}
@keyframes pzwv{0%,100%{transform:none}15%,45%,75%{transform:rotate(-14deg) translateX(-3px)}30%,60%,90%{transform:rotate(10deg)}}
.a-cheer{animation:pzch 1.1s}
@keyframes pzch{0%,100%{transform:none}15%{transform:scale(1.1,.85)}35%{transform:perspective(300px) translateY(-26px) rotateY(180deg)}60%{transform:perspective(300px) translateY(-8px) rotateY(360deg)}80%{transform:scale(1.08,.9)}}
.a-think{animation:pzth 2.4s ease-in-out infinite}
@keyframes pzth{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(5deg) translateY(-3px)}}
.a-think .pzp{transform:translate(7px,-8px)!important}
.a-think .pzbr.r{transform:translateY(-9px) rotate(-6deg)}
.a-think #pzd{opacity:1}
#pzd circle{animation:pzdt 1.2s infinite}
#pzd circle:nth-child(2){animation-delay:.2s}#pzd circle:nth-child(3){animation-delay:.4s}
@keyframes pzdt{50%{transform:scale(1.3)}}
.a-alert{animation:pzal .6s}
@keyframes pzal{0%,100%{transform:none}20%{transform:translateY(-16px) scale(.95,1.1)}40%,80%{transform:rotate(-4deg)}60%{transform:rotate(4deg)}}
.a-alert .pzbr,.a-brow .pzbr{transform:translateY(-10px)}
.a-brow .pzbr{animation:pzbw .9s}
@keyframes pzbw{0%,100%{transform:none}30%,70%{transform:translateY(-11px)}}
.a-nod{animation:pznd .8s}
@keyframes pznd{0%,50%,100%{transform:none}25%,75%{transform:rotate(7deg) translateY(4px)}}
.a-shake{animation:pzsk .6s}
@keyframes pzsk{0%,100%{transform:none}20%,60%{transform:translateX(-5px) rotate(-3deg)}40%,80%{transform:translateX(5px) rotate(3deg)}}
.a-talk{animation:pztk .38s ease-in-out infinite}
@keyframes pztk{50%{transform:translateY(-3px) scale(1.02,.98)}}
.a-talk .pzbr{animation:pzbt .5s ease-in-out infinite alternate}
@keyframes pzbt{to{transform:translateY(-5px)}}
.a-appear{animation:pzap .7s}
@keyframes pzap{0%{transform:scale(0) rotate(-180deg);opacity:0}60%{transform:scale(1.2) rotate(10deg);opacity:1}100%{transform:none}}
.a-sleep{animation:pzsl 4s ease-in-out infinite}
@keyframes pzsl{50%{transform:rotate(4deg) scaleY(.985)}}
.a-sleep svg{animation-duration:6s}
.a-sleep .pze{animation:none;transform:scaleY(.08)}
.a-sleep .pzp{transform:none!important}
.a-sleep #pzz{opacity:1}
#pzz text{animation:pzzz 3s infinite}
#pzz text+text{animation-delay:1s}
@keyframes pzzz{0%{opacity:0;transform:translateY(8px)}40%{opacity:1}100%{opacity:0;transform:translateY(-14px)}}
#pzs{display:flex;flex-wrap:wrap;gap:.3rem;margin-top:.45rem}
#pzs:empty{display:none}
#pzs button{font-size:.78rem;padding:.12rem .55rem;border-radius:999px}
@media (prefers-reduced-motion:reduce){#pzc,#pzc *{animation:none!important}}

function currentProfileId(){try{return localStorage.getItem("desktop-active-profile")||"main"}catch(e){return"main"}}
function profileStorageKey(k){return PROFILE_DATA_KEYS.indexOf(k)>=0?"profile:"+currentProfileId()+":"+k:k}
function ensureLocalProfiles(){
  try{
    var profiles=JSON.parse(localStorage.getItem("desktop-local-profiles")||"null");
    if(!Array.isArray(profiles)||!profiles.length){profiles=[{id:"main",name:"Main profile",avatar:"👤",created:Date.now()}];localStorage.setItem("desktop-local-profiles",JSON.stringify(profiles));localStorage.setItem("desktop-active-profile","main");}
    var active=localStorage.getItem("desktop-active-profile");
    if(!profiles.some(function(p){return p.id===active})){active=profiles[0].id;localStorage.setItem("desktop-active-profile",active)}
    // Keep existing notes/tasks when upgrading an older copy of the site.
    if(active==="main"&&!localStorage.getItem("desktop-profile-migrated")){
      PROFILE_DATA_KEYS.forEach(function(k){var legacy=localStorage.getItem(k),target="profile:main:"+k;if(legacy!==null&&localStorage.getItem(target)===null)localStorage.setItem(target,legacy)});
      localStorage.setItem("desktop-profile-migrated","1");
    }
  }catch(e){}
}
ensureLocalProfiles();
(function syncDesktopProfile(){try{var ps=JSON.parse(localStorage.getItem("desktop-local-profiles")||"[]"),a=ps.find(function(x){return x.id===currentProfileId()})||ps[0];if(a){if($("#xu"))$("#xu").textContent=a.name;if($("#xa"))$("#xa").textContent=a.avatar}}catch(e){}})();
function load(k,d){try{var v=localStorage.getItem(profileStorageKey(k));return v===null?d:JSON.parse(v)}catch(e){return d}}
function save(k,v){try{localStorage.setItem(profileStorageKey(k),JSON.stringify(v))}catch(e){}}
var cleanup=null;

/* Custom wallpaper storage. Images are kept in IndexedDB rather than localStorage,
   so larger photos do not consume the small preferences quota. */
var customWallpaperURL=null;
function wallpaperDB(){
  return new Promise(function(resolve,reject){
    if(!window.indexedDB){reject(new Error("Image storage is unavailable"));return;}
    var req=indexedDB.open("dylan-desktop-assets",1);
    req.onupgradeneeded=function(){var db=req.result;if(!db.objectStoreNames.contains("wallpapers"))db.createObjectStore("wallpapers");};
    req.onsuccess=function(){resolve(req.result)};req.onerror=function(){reject(req.error||new Error("Could not open image storage"))};
  });
}
function storeCustomWallpaper(blob){
  return wallpaperDB().then(function(db){return new Promise(function(resolve,reject){var tx=db.transaction("wallpapers","readwrite");tx.objectStore("wallpapers").put(blob,"desktop");tx.oncomplete=function(){db.close();resolve()};tx.onerror=function(){db.close();reject(tx.error||new Error("Could not save image"))};});});
}
function readCustomWallpaper(){
  return wallpaperDB().then(function(db){return new Promise(function(resolve,reject){var tx=db.transaction("wallpapers","readonly"),req=tx.objectStore("wallpapers").get("desktop");req.onsuccess=function(){var result=req.result;db.close();resolve(result||null)};req.onerror=function(){db.close();reject(req.error||new Error("Could not read image"))};});});
}
function deleteCustomWallpaper(){
  return wallpaperDB().then(function(db){return new Promise(function(resolve,reject){var tx=db.transaction("wallpapers","readwrite");tx.objectStore("wallpapers").delete("desktop");tx.oncomplete=function(){db.close();resolve()};tx.onerror=function(){db.close();reject(tx.error||new Error("Could not remove image"))};});});
}
function setCustomWallpaperPreview(blob){
  if(customWallpaperURL)URL.revokeObjectURL(customWallpaperURL);
  customWallpaperURL=URL.createObjectURL(blob);
  document.documentElement.style.setProperty("--custom-wallpaper",'url("'+customWallpaperURL+'")');
}
function clearCustomWallpaperPreview(){
  document.documentElement.style.removeProperty("--custom-wallpaper");
  if(customWallpaperURL){URL.revokeObjectURL(customWallpaperURL);customWallpaperURL=null;}
}
function restoreCustomWallpaper(){
  if(customWallpaperURL)return;
  readCustomWallpaper().then(function(blob){
    if(document.body.dataset.wallpaper!=="custom")return;
    if(blob)setCustomWallpaperPreview(blob);
  }).catch(function(){});
}

/* theme */
function applyTheme(){
  var t=load("theme","blue"),p=load("prefs",{});
  if(t==="auto"||t==="blue")document.documentElement.removeAttribute("data-theme");
  else document.documentElement.setAttribute("data-theme",t);
  var palette={blue:"#0078d4",auto:"#0078d4",olive:"#107c10",silver:"#6b6f78",midnight:"#5b8cff",violet:"#7c55d9",rose:"#d34f84",forest:"#21865b"},accent=load("accent",palette[t]||"#0078d4");
  document.documentElement.style.setProperty("--accent",accent);
  document.documentElement.style.setProperty("--ac",accent);
  document.documentElement.dataset.motion=p.motion||"full";
  document.documentElement.dataset.transparency=p.transparency===false?"off":"on";
  document.documentElement.dataset.iconSize=p.iconSize||"normal";
  document.documentElement.dataset.contrast=p.highContrast?"high":"normal";
  document.documentElement.style.setProperty("--wallpaper-shade",String(Math.max(0,Math.min(45,Number(p.wallpaperShade)||0))/100));
  document.documentElement.style.setProperty("--wallpaper-size",p.wallpaperFit==="contain"?"contain":p.wallpaperFit==="tile"?"auto":"cover");
  document.documentElement.style.setProperty("--wallpaper-repeat",p.wallpaperFit==="tile"?"repeat":"no-repeat");
  document.body.dataset.wallpaper=p.wallpaper||"blue";
  var heading=document.getElementById("desktopHeading");if(heading)heading.textContent="Dylan’s Website";
  if(p.wallpaper==="custom")restoreCustomWallpaper();else clearCustomWallpaperPreview();
}

/* Calculator: compact, keyboard-friendly four-function calculator. */
function calculator(el){
  el.innerHTML='<div class="app-hero"><div><h2>Calculator</h2><p>Everyday maths with memory and a reusable calculation history.</p></div><span class="app-pill">UTILITY</span></div><section class="calc-app"><div class="calc-display" aria-live="polite"><small id="calcExpr">Ready</small><strong id="calcValue">0</strong></div><div class="calc-memory"><button id="calcMC" title="Clear memory">MC</button><button id="calcMR" title="Recall memory">MR</button><button id="calcMPlus" title="Add display to memory">M+</button><button id="calcMMinus" title="Subtract display from memory">M−</button><button id="calcCopy" title="Copy result">Copy</button></div><div class="calc-keys" id="calcKeys"></div><div class="calc-history"><div class="calc-history-head"><span>Recent calculations</span><button class="ghost" id="calcHistoryClear">Clear history</button></div><ol id="calcHistory" class="calc-history-list"></ol></div><p class="muted" style="margin:10px 0 0;font-size:10px">Keyboard supported · Enter to calculate · Escape to clear · Memory stays while this app is open</p></section>';
  var keys=[['AC','clear'],['±','sign'],['%','percent'],['÷','op'],['7','digit'],['8','digit'],['9','digit'],['×','op'],['4','digit'],['5','digit'],['6','digit'],['−','op'],['1','digit'],['2','digit'],['3','digit'],['+','op'],['0','digit','wide'],['.','decimal'],['=','equal']];
  var val='0',stored=null,operation=null,replace=true,expr='Ready',memory=0,history=[];
  function show(){$('#calcValue').textContent=val;$('#calcExpr').textContent=expr;}
  function fmt(v){var n=Number(v);if(!isFinite(n))return'Error';if(Math.abs(n)>1e12||(Math.abs(n)<1e-8&&n!==0))return n.toExponential(6);return String(Number(n.toPrecision(11)));}
  function drawHistory(){var root=$('#calcHistory');root.innerHTML='';history.forEach(function(item){var li=document.createElement('li'),txt=document.createElement('span'),use=document.createElement('button');li.className='calc-history-item';txt.textContent=item.expr+' '+item.result;use.className='ghost';use.textContent='Use';use.onclick=function(){val=item.result;stored=null;operation=null;expr='Recalled from history';replace=true;show()};li.append(txt,use);root.appendChild(li)});if(!history.length){var e=document.createElement('li');e.className='muted';e.textContent='Your calculations will appear here.';root.appendChild(e)}}
  function compute(){if(operation===null||stored===null)return;var a=stored,b=Number(val),op=operation,r=NaN;if(op==='+')r=a+b;else if(op==='−')r=a-b;else if(op==='×')r=a*b;else if(op==='÷')r=b===0?NaN:a/b;var expression=fmt(a)+' '+op+' '+fmt(b)+' =';val=fmt(r);expr=expression;history.unshift({expr:expression,result:val});history=history.slice(0,12);drawHistory();stored=null;operation=null;replace=true;}
  function press(kind,arg){
    if(kind==='digit'){var d=arg.value;if(val==='Error'||replace){val=d;replace=false}else if(val.length<15)val=val==='0'?d:val+d;}
    else if(kind==='decimal'){if(val==='Error'||replace){val='0.';replace=false}else if(val.indexOf('.')<0)val+='.';}
    else if(kind==='op'){if(operation!==null&&!replace)compute();stored=Number(val);operation=arg.value;expr=fmt(stored)+' '+operation;replace=true;}
    else if(kind==='equal')compute();
    else if(kind==='clear'){val='0';stored=null;operation=null;expr='Ready';replace=true;}
    else if(kind==='sign'){if(val!=='0'&&val!=='Error')val=val.charAt(0)==='-'?val.slice(1):'-'+val;}
    else if(kind==='percent'){if(val!=='Error')val=fmt(Number(val)/100);}
    show();
  }

  el.innerHTML='<div class="app-hero"><div><h2>Paint Studio</h2><p>Sketch, annotate and save a drawing to your profile or export it as a PNG.</p></div><span class="app-pill">CREATIVE</span></div><div class="paint-workspace"><div class="paint-toolbar"><div class="paint-toolset" role="group" aria-label="Drawing tools"><button type="button" class="on" data-tool="brush">✎ Brush</button><button type="button" data-tool="line">／ Line</button><button type="button" data-tool="rect">▭ Rectangle</button><button type="button" data-tool="eraser">▱ Eraser</button></div><label>Colour <input id="paintColour" type="color" value="#176db5"></label><label>Size <input id="paintSize" type="range" min="1" max="48" value="8"><output id="paintSizeOut">8 px</output></label></div><div class="paint-canvas-wrap"><canvas id="paintCanvas" width="900" height="560" aria-label="Paint drawing surface"></canvas></div><div class="paint-actions"><button id="paintUndo" class="ghost" disabled>Undo</button><button id="paintRedo" class="ghost" disabled>Redo</button><button id="paintClear" class="ghost">Clear</button><span class="grow"></span><button id="paintOpen" class="ghost">Open saved</button><button id="paintSave">Save to profile</button><button id="paintExport">Download PNG</button></div><p class="muted" id="paintStatus" aria-live="polite">Draw with your mouse, trackpad or finger. Changes are kept in this workspace until saved.</p></div>';
  canvas=$('#paintCanvas');ctx=canvas.getContext('2d');
  function blank(){ctx.fillStyle='#fff';ctx.fillRect(0,0,canvas.width,canvas.height)}
  function push(){try{history.push(ctx.getImageData(0,0,canvas.width,canvas.height));if(history.length>24)history.shift();redo=[];sync()}catch(e){}}
  function sync(){$('#paintUndo').disabled=!history.length;$('#paintRedo').disabled=!redo.length}
  function point(e){var r=canvas.getBoundingClientRect();return{x:(e.clientX-r.left)*canvas.width/r.width,y:(e.clientY-r.top)*canvas.height/r.height}}
  function drawShape(a,b,preview){ctx.save();ctx.lineWidth=size;ctx.lineCap='round';ctx.lineJoin='round';ctx.strokeStyle=tool==='eraser'?'#fff':colour;ctx.fillStyle=ctx.strokeStyle;if(tool==='line'){ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke()}else if(tool==='rect'){ctx.strokeRect(a.x,a.y,b.x-a.x,b.y-a.y)}ctx.restore()}
  function setTool(t){tool=t;el.querySelectorAll('[data-tool]').forEach(function(b){b.classList.toggle('on',b.dataset.tool===t)})}
  canvas.addEventListener('pointerdown',function(e){e.preventDefault();canvas.setPointerCapture(e.pointerId);push();drawing=true;start=point(e);snapshot=ctx.getImageData(0,0,canvas.width,canvas.height);if(tool==='brush'||tool==='eraser'){ctx.beginPath();ctx.moveTo(start.x,start.y);ctx.lineWidth=size;ctx.lineCap='round';ctx.lineJoin='round';ctx.strokeStyle=tool==='eraser'?'#fff':colour;ctx.lineTo(start.x+.1,start.y+.1);ctx.stroke()}});
  canvas.addEventListener('pointermove',function(e){if(!drawing)return;var p=point(e);if(tool==='brush'||tool==='eraser'){ctx.lineWidth=size;ctx.lineCap='round';ctx.lineJoin='round';ctx.strokeStyle=tool==='eraser'?'#fff':colour;ctx.lineTo(p.x,p.y);ctx.stroke()}else{ctx.putImageData(snapshot,0,0);drawShape(start,p,true)}});
  function finish(e){if(!drawing)return;var p=point(e);if(tool==='line'||tool==='rect'){ctx.putImageData(snapshot,0,0);drawShape(start,p,false)}drawing=false;start=null;snapshot=null;$('#paintStatus').textContent='Drawing updated · '+history.length+' undo step(s) available.';sync()}
  canvas.addEventListener('pointerup',finish);canvas.addEventListener('pointercancel',finish);
  el.querySelectorAll('[data-tool]').forEach(function(b){b.onclick=function(){setTool(b.dataset.tool)}});
  $('#paintColour').oninput=function(){colour=this.value;if(tool==='eraser')setTool('brush')};$('#paintSize').oninput=function(){size=Number(this.value);$('#paintSizeOut').textContent=size+' px'};
  $('#paintUndo').onclick=function(){if(!history.length)return;redo.push(ctx.getImageData(0,0,canvas.width,canvas.height));ctx.putImageData(history.pop(),0,0);sync();$('#paintStatus').textContent='Last stroke undone.'};
  $('#paintRedo').onclick=function(){if(!redo.length)return;history.push(ctx.getImageData(0,0,canvas.width,canvas.height));ctx.putImageData(redo.pop(),0,0);sync();$('#paintStatus').textContent='Stroke restored.'};
  $('#paintClear').onclick=function(){if(!confirm('Clear the whole canvas?'))return;push();blank();$('#paintStatus').textContent='Canvas cleared.'};
  $('#paintSave').onclick=function(){try{var data=canvas.toDataURL('image/png');save('paintstudio',data);saved=data;$('#paintStatus').textContent='Saved to this browser profile.';toast('Drawing saved')}catch(e){toast('Could not save this drawing')}};
  $('#paintOpen').onclick=function(){var data=load('paintstudio','');if(!data){toast('No saved drawing in this profile yet');return}var img=new Image();img.onload=function(){push();blank();ctx.drawImage(img,0,0,canvas.width,canvas.height);$('#paintStatus').textContent='Saved drawing loaded.'};img.onerror=function(){toast('Saved drawing could not be opened')};img.src=data};
  $('#paintExport').onclick=function(){var a=document.createElement('a');a.download='dylan-painting.png';a.href=canvas.toDataURL('image/png');a.click();toast('PNG export ready')};
  blank();if(saved){var img=new Image();img.onload=function(){ctx.drawImage(img,0,0,canvas.width,canvas.height)};img.src=saved}
  cleanup=function(){drawing=false};
}

/* Tic-Tac-Toe: local two-player or computer opponent with minimax difficulty. */
function ticTacToe(el){
  var board=Array(9).fill(''),turn='X',mode='cpu',difficulty='smart',locked=false,finished=false,aiTimer=null,stats=load('tictactoeStats',{x:0,o:0,d:0,games:0});
  el.innerHTML='<div class="app-hero"><div><h2>Tic-Tac-Toe</h2><p>Play a quick local match or challenge the computer.</p></div><span class="app-pill">ARCADE</span></div><div class="ttt-controls"><label>Opponent <select id="tttMode" style="width:auto"><option value="cpu">Computer</option><option value="local">Two players</option></select></label><label>Computer level <select id="tttLevel" style="width:auto"><option value="casual">Casual</option><option value="smart" selected>Strategic</option></select></label><button id="tttNew">New game</button></div><div class="ttt-score"><div><small id="tttXLabel">You · X</small><b id="tttX">0</b></div><div><small id="tttOppLabel">Computer · O</small><b id="tttO">0</b></div><div><small>Draws</small><b id="tttD">0</b></div></div><div class="ttt-board" id="tttBoard" role="group" aria-label="Tic-Tac-Toe board"></div><p class="ttt-status" id="tttStatus" aria-live="polite">Your turn. Choose a square.</p><p class="muted">Three in a row wins. Strategic mode searches all possible moves; casual mode makes a random legal move.</p>';
  var wins=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
  function winner(b){for(var i=0;i<wins.length;i++){var line=wins[i],v=b[line[0]];if(v&&v===b[line[1]]&&v===b[line[2]])return v}return b.every(Boolean)?'D':''}
  function evaluate(b,depth){var w=winner(b);if(w==='O')return 10-depth;if(w==='X')return depth-10;if(w==='D')return 0;var best= -Infinity;for(var i=0;i<9;i++)if(!b[i]){b[i]='O';best=Math.max(best,minimax(b,depth+1,true));b[i]=''}return best}
  function minimax(b,depth,maximizing){var w=winner(b);if(w==='O')return 10-depth;if(w==='X')return depth-10;if(w==='D')return 0;var best=maximizing?-Infinity:Infinity;for(var i=0;i<9;i++)if(!b[i]){b[i]=maximizing?'O':'X';var v=minimax(b,depth+1,!maximizing);b[i]='';best=maximizing?Math.max(best,v):Math.min(best,v)}return best}
  function aiMove(){var legal=board.map(function(v,i){return v?null:i}).filter(function(v){return v!==null});if(!legal.length)return;var pick=legal[Math.floor(Math.random()*legal.length)];if(difficulty==='smart'){var best=-Infinity;legal.forEach(function(i){board[i]='O';var score=minimax(board,0,false);board[i]='';if(score>best){best=score;pick=i}})}play(pick,'O')}
  function draw(){var host=$('#tttBoard');host.innerHTML='';board.forEach(function(v,i){var b=document.createElement('button');b.type='button';b.className='ttt-cell'+(v?' '+v.toLowerCase():'');b.textContent=v;b.disabled=!!v||finished||locked;b.setAttribute('aria-label','Square '+(i+1)+(v?', '+v:' empty'));b.onclick=function(){if(mode==='cpu'&&turn!=='X')return;play(i,turn)};host.appendChild(b)});$('#tttX').textContent=stats.x;$('#tttO').textContent=stats.o;$('#tttD').textContent=stats.d;$('#tttXLabel').textContent=mode==='cpu'?'You · X':'Player 1 · X';$('#tttOppLabel').textContent=mode==='cpu'?'Computer · O':'Player 2 · O'}
  function conclude(w){finished=true;locked=false;if(w==='D'){stats.d++;$('#tttStatus').textContent='It’s a draw. Nice game.'}else{if(w==='X')stats.x++;else stats.o++;$('#tttStatus').textContent=(w==='X'?'X wins!':'O wins!')+' Start a new game to play again.'}stats.games++;save('tictactoeStats',stats);draw()}
  function play(i,mark){if(finished||board[i])return;board[i]=mark;turn=mark==='X'?'O':'X';var w=winner(board);if(w){draw();conclude(w);return}draw();if(mode==='cpu'&&turn==='O'){locked=true;$('#tttStatus').textContent='Computer is thinking…';draw();aiTimer=setTimeout(function(){locked=false;aiMove();if(!finished)$('#tttStatus').textContent='Your turn. Choose a square.'},difficulty==='smart'?260:420)}else $('#tttStatus').textContent=(turn==='X'?'Player 1 · X':'Player 2 · O')+' to move.'}
  function reset(){clearTimeout(aiTimer);board=Array(9).fill('');turn='X';locked=false;finished=false;$('#tttStatus').textContent='Your turn. Choose a square.';draw()}
  $('#tttMode').onchange=function(){mode=this.value;$('#tttLevel').disabled=mode!=='cpu';reset()};$('#tttLevel').onchange=function(){difficulty=this.value;reset()};$('#tttNew').onclick=reset;reset();cleanup=function(){clearTimeout(aiTimer)};
}

    pt=pt.filter(function(p){return p.l>0});

  c.ontouchend=function(e){var dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;if(Math.abs(dx)>Math.abs(dy))turn(dx>0?1:-1,0);else turn(0,dy>0?1:-1)};

  reset();raf=requestAnimationFrame(loop);

/* local mode: accounts and messages stored in this browser when opened as a plain .html file */
function luid(){var u=load("luid","");if(!u){u="l"+Math.random().toString(36).slice(2,10);save("luid",u)}return u}
function localDb(){
  var D=load("ldb",{}),S=[];
  function col(n){return D[n]||(D[n]={})}
  function snap(n,o,l){
    var c=col(n),ids=Object.keys(c);
    if(o)ids.sort(function(a,b){var x=c[a][o.f],y=c[b][o.f];return o.d==="desc"?y-x:x-y});
    if(l)ids=ids.slice(0,l);
    return{docs:ids.map(function(id){return{id:id,exists:true,data:function(){return JSON.parse(JSON.stringify(c[id]))}}})};
  }
  function fire(n){save("ldb",D);S.slice().forEach(function(s){if(s.n===n)s.cb(snap(n,s.o,s.l))})}
  function sub(n,o,l){return function(cb){var s={n:n,o:o,l:l,cb:cb};S.push(s);setTimeout(function(){cb(snap(n,o,l))},0);return function(){var i=S.indexOf(s);if(i>=0)S.splice(i,1)}}}
  function ref(n,id){return{
    set:async function(v){col(n)[id]=JSON.parse(JSON.stringify(v));fire(n)},
    update:async function(v){var c=col(n);c[id]=Object.assign(c[id]||{},JSON.parse(JSON.stringify(v)));fire(n)},
    delete:async function(){delete col(n)[id];fire(n)},
    get:async function(){var v=col(n)[id];return{exists:!!v,id:id,data:function(){return JSON.parse(JSON.stringify(v))}}}}}
  function query(n,o,l){return{orderBy:function(f,d){return query(n,{f:f,d:d},l)},limit:function(k){return query(n,o,k)},onSnapshot:sub(n,o,l)}}
  return{
    collection:function(n){var q=query(n);q.add=async function(v){var id=Date.now().toString(36)+Math.random().toString(36).slice(2,6);await ref(n,id).set(v);return ref(n,id)};q.doc=function(id){return ref(n,id)};return q},
    doc:function(p){var a=p.split("/");return ref(a.slice(0,-1).join("/"),a[a.length-1])}
  };
}

/* core: accounts, bans, presence */
var G={db:null,uid:"",admin:false,room:null,peers:[],users:[],bans:{},me:null,ban:null,goto:null};

function listen(fn,extra){subs.push(fn);var prev=cleanup;cleanup=function(){var i=subs.indexOf(fn);if(i>=0)subs.splice(i,1);if(extra)extra();if(prev)prev()}}
function uname(id){var u=G.users.find(function(x){return x.id===id});return u?u.name:"Someone"}
function banned(b){return !!b&&(b.status==="banned"||(b.status==="suspended"&&Number(b.until)>Date.now()))}

function aid(n){return String(n||"").replace(/^@+/,"").toLowerCase()}

async function boot(){

/* calls (1-to-1 voice over WebRTC, signalled through the room) */
var pc=null,ms=null,cc=null,inc=null,au=null;
function myPeer(){var p=G.peers.find(function(x){return x.sameTab});return p&&p.peer}
function peerOf(uid){return G.peers.find(function(p){return !p.isMe&&p.presence&&p.presence.uid===uid})}
function sigSend(to,t,s){if(G.room)G.room.emit("sig",{to:to,type:t,sdp:s||"",name:G.me?G.me.name:"Someone"}).catch(function(){})}
function cshow(t,acc,live){
  $("#cl").hidden=false;$("#ct").textContent=t;
  $("#ca").hidden=!acc;$("#cm").hidden=!live;$("#ch").hidden=!(acc||live);$("#cm").textContent="Mute";
}
function waitIce(p){return new Promise(function(r){
  if(p.iceGatheringState==="complete")return r();
  p.onicegatheringstatechange=function(){if(p.iceGatheringState==="complete")r()};
  setTimeout(r,4000);
})}
async function mkCall(){
  ms=await navigator.mediaDevices.getUserMedia({audio:true});
  pc=new RTCPeerConnection({iceServers:[{urls:"stun:stun.l.google.com:19302"}]});
  ms.getTracks().forEach(function(t){pc.addTrack(t,ms)});
  pc.ontrack=function(e){if(!au){au=new Audio();au.autoplay=true}au.srcObject=e.streams[0];au.play().catch(function(){})};
  pc.onconnectionstatechange=function(){
    var s=pc&&pc.connectionState;
    if(s==="connected"&&cc)cshow("In call with "+cc.name,0,1);
    if(s==="failed"||s==="disconnected")hang("Call dropped.");
  };
}
async function startCall(peer,nm){
  if(pc||inc||!G.me||banned(G.ban))return;
  cc={peer:peer,name:nm};cshow("Calling "+nm+"…",0,1);
  try{await mkCall();await pc.setLocalDescription(await pc.createOffer());await waitIce(pc);sigSend(peer,"offer",pc.localDescription.sdp)}
  catch(e){hang("Couldn’t start the call. Check microphone access.")}
}
async function onSig(m){
  var d=m.data;if(!d||m.isMe||d.to!==myPeer())return;
  if(d.type==="offer"){
    if(!G.me||banned(G.ban)||pc||inc){sigSend(m.peer,"busy");return}
    inc={peer:m.peer,name:String(d.name||"Someone").slice(0,30),sdp:String(d.sdp)};
    cshow("Incoming call from "+inc.name,1,0);
  }else if(d.type==="answer"&&pc&&cc&&cc.peer===m.peer){
    try{await pc.setRemoteDescription({type:"answer",sdp:String(d.sdp)})}catch(e){hang("Call failed.")}
  }else if(d.type==="end"&&((cc&&cc.peer===m.peer)||(inc&&inc.peer===m.peer))){hang("Call ended.",1)}
  else if(d.type==="busy"&&cc&&cc.peer===m.peer){hang(cc.name+" is busy.",1)}
}
async function accept(){
  var i=inc;inc=null;cc={peer:i.peer,name:i.name};cshow("Connecting…",0,1);
  try{await mkCall();await pc.setRemoteDescription({type:"offer",sdp:i.sdp});await pc.setLocalDescription(await pc.createAnswer());await waitIce(pc);sigSend(i.peer,"answer",pc.localDescription.sdp)}
  catch(e){hang("Couldn’t connect the call.")}
}
function hang(msg,quiet){
  var p=cc?cc.peer:(inc&&inc.peer);
  if(p&&!quiet)sigSend(p,"end");
  if(pc){try{pc.close()}catch(e){}}pc=null;
  if(ms){ms.getTracks().forEach(function(t){t.stop()});ms=null}
  cc=inc=null;
  if(msg){cshow(msg,0,0);setTimeout(function(){if(!pc&&!inc&&!cc)$("#cl").hidden=true},2500)}else $("#cl").hidden=true;
}
$("#ca").onclick=accept;$("#ch").onclick=function(){hang()};
$("#cm").onclick=function(){
  var t=ms&&ms.getAudioTracks()[0];if(!t)return;
  t.enabled=!t.enabled;$("#cm").textContent=t.enabled?"Mute":"Unmute";
};

async function dm(id,requestedName){

    try{await G.db.doc('chats/'+cid).set({type:'dm',members:[G.uid,contactId],peerName:'@'+label.replace(/^@+/,''),localOnly:true,t:Date.now()})}catch(e){}
    G.goto=cid;open(apps.find(function(a){return a.id==='chat'}));return;
  }

  try{await G.db.doc('chats/'+cid).set({type:'dm',members:ids,t:Date.now()})}catch(e){}

}

}
